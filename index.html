<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .thai{font-family:'Prompt',sans-serif}
  .thai-adj{font-family:'Prompt',sans-serif;font-size:1.05em}
  ::-webkit-scrollbar{display:none}
  .glow-pink{box-shadow:0 0 15px rgba(255,20,147,0.4)}
  .glow-pink-strong{box-shadow:0 0 30px rgba(255,20,147,0.6)}
  .text-glow{text-shadow:0 0 8px rgba(255,20,147,0.5)}
  body{background:#000;color:#fff}

  /* Film grain */
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
    background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    opacity:.5}

  /* Ambient blobs */
  .blob{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0;animation:drift 12s ease-in-out infinite alternate}
  .blob-1{width:550px;height:550px;background:rgba(255,20,147,0.06);top:-180px;right:-120px}
  .blob-2{width:400px;height:400px;background:rgba(255,20,147,0.04);bottom:-100px;left:-80px;animation-delay:-5s}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(35px,25px)}}

  /* Skeleton */
  .skel{background:linear-gradient(90deg,#111 25%,#1c1c1c 50%,#111 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:1rem}
  @keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Pages */
  .page{display:none}
  .page.active{display:block;animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* Movie card */

  .mcard:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 24px 48px rgba(0,0,0,0.9),0 0 24px rgba(255,20,147,0.2)}

  .slot.sold{opacity:.3;cursor:not-allowed;text-decoration:line-through;pointer-events:none}

  /* Search bar */
  #search-bar{display:none}
  #search-bar.open{display:block}
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════════════════
const API_BASE   = 'https://doomovie-production.up.railway.app/api';
// TMDB — free, just needs an API read token
// Get yours FREE at https://www.themoviedb.org/settings/api (takes 2 min)
// Then replace the string below with your Bearer token
const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjY2I1MzYwODNmZjUxZjI5MGQ1NWRjMzgwZDE2ZDlhZCIsIm5iZiI6MTc3NTA3NTQwNy41NTMsInN1YiI6IjY5Y2Q4MDRmYjQwNzg1YWI4YmE2MzcwZiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.0mdc6AB5oWTH3VWhCfcKa9NSQsKqidWeAphKShbsxYM';
const TMDB_IMG   = 'https://image.tmdb.org/t/p';
const HAS_TMDB   = TMDB_TOKEN !== 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjY2I1MzYwODNmZjUxZjI5MGQ1NWRjMzgwZDE2ZDlhZCIsIm5iZiI6MTc3NTA3NTQwNy41NTMsInN1YiI6IjY5Y2Q4MDRmYjQwNzg1YWI4YmE2MzcwZiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.0mdc6AB5oWTH3VWhCfcKa9NSQsKqidWeAphKShbsxYM';

// ════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════
const S = {
  mode:'movie', date:todayStr(),
  lat:null, lng:null, query:'',
  movies:[], cinemas:[],
  tmdbCache:{},   // title → { poster_path, backdrop_path, id, overview }
  trailerUrl:null,
};

// ════════════════════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════════════════════
function todayStr(){
  const d = new Date(Date.now()+7*3600000);
  return d.toISOString().split('T')[0];
}
function thDayName(d){ return ['อา','จ','อ','พ','พฤ','ศ','ส'][d.getDay()]; }
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
}
function fmtDateTH(str){
  return new Date(str).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'});
}

// TMDB poster — poster_url from our API first, TMDB enrichment as fallback/enhancement
function getPosterSrc(movie){
  // If we have a real poster from SF/Major API, use it
  if(movie.poster_url && !movie.poster_url.includes('lh3.google')) return movie.poster_url;
  // Try TMDB cache
  const t = S.tmdbCache[movie._tmdbKey];
  if(t?.poster_path) return `${TMDB_IMG}/w342${t.poster_path}`;
  // Original poster_url as last resort
  return movie.poster_url || null;
}
function getBackdropSrc(movie){
  const t = S.tmdbCache[movie._tmdbKey];
  if(t?.backdrop_path) return `${TMDB_IMG}/w1280${t.backdrop_path}`;
  if(movie.backdrop_url) return movie.backdrop_url;
  if(movie.poster_url) return movie.poster_url;
  return null;
}

// ════════════════════════════════════════════════════════════════════════════
// TMDB ENRICHMENT
// ════════════════════════════════════════════════════════════════════════════
async function enrichWithTMDB(movies){
  if(!HAS_TMDB) return; // skip if no token

  const toFetch = movies.filter(m => !S.tmdbCache[m._tmdbKey]);
  if(!toFetch.length) return;

  // Batch search — 5 at a time to avoid rate limits
  const chunks = [];
  for(let i=0;i<toFetch.length;i+=5) chunks.push(toFetch.slice(i,i+5));

  for(const chunk of chunks){
    await Promise.allSettled(chunk.map(async m => {
      const q = encodeURIComponent(m.title_en || m.title_th);
      const res = await fetch(`https://api.themoviedb.org/3/search/movie?query=${q}&language=th-TH&page=1`, {
        headers:{ Authorization:`Bearer ${TMDB_TOKEN}` }
      });
      if(!res.ok) return;
      const data = await res.json();
      const hit = data.results?.[0];
      if(hit){
        S.tmdbCache[m._tmdbKey] = {
          poster_path:   hit.poster_path,
          backdrop_path: hit.backdrop_path,
          overview:      hit.overview,
          tmdb_id:       hit.id,
          vote_average:  hit.vote_average,
        };
      }
    }));
  }
}

// ════════════════════════════════════════════════════════════════════════════
// DATE PILLS
// ════════════════════════════════════════════════════════════════════════════
function buildDates(containerId, onSelect){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = '';
  for(let i=0;i<7;i++){
    const d = new Date(Date.now()+7*3600000);
    d.setDate(d.getDate()+i);
    const str = d.toISOString().split('T')[0];
    const active = str===S.date;
    const label  = i===0?'วันนี้':i===1?'พรุ่งนี้':thDayName(d);
    const btn = document.createElement('button');
    btn.dataset.date = str;
    btn.innerHTML = `<span class="text-[9px] uppercase font-bold tracking-wider thai block">${label}</span><span class="text-xl font-black">${d.getDate()}</span>`;
    btn.className = `flex flex-col items-center justify-center min-w-[56px] h-[68px] rounded-2xl flex-shrink-0 transition-all border ${
      active ? 'bg-primary text-white glow-pink border-transparent'
             : 'bg-surface-container border-outline-variant text-on-surface-variant hover:border-primary/40'}`;
    btn.onclick = ()=>{ S.date=str; refreshAllDates(); onSelect(str); };
    el.appendChild(btn);
  }
}
function refreshAllDates(){
  ['movie-dates','detail-dates'].forEach(id=>{
    document.querySelectorAll(`#${id} button`).forEach(b=>{
      const active = b.dataset.date===S.date;
      b.className = `flex flex-col items-center justify-center min-w-[56px] h-[68px] rounded-2xl flex-shrink-0 transition-all border ${
        active ? 'bg-primary text-white glow-pink border-transparent'
               : 'bg-surface-container border-outline-variant text-on-surface-variant hover:border-primary/40'}`;
    });
  });
  document.getElementById('detail-date-label').textContent = fmtDateTH(S.date);
}

// ════════════════════════════════════════════════════════════════════════════
// MODE
// ════════════════════════════════════════════════════════════════════════════
function setMode(mode){
  S.mode=mode;
  // Nav buttons
  const movieActive  = 'px-5 py-1.5 rounded-full bg-primary text-white font-bold text-sm glow-pink transition-all';
  const movieInactive= 'px-5 py-1.5 rounded-full text-on-surface-variant font-medium text-sm hover:text-white transition-all';
  const mobActive    = 'px-3 py-1.5 rounded-full bg-primary text-white text-xs font-bold glow-pink transition-all';
  const mobInactive  = 'px-3 py-1.5 rounded-full text-on-surface-variant text-xs transition-all';
  document.getElementById('nb-movie').className  = mode==='movie' ? movieActive  : movieInactive;
  document.getElementById('nb-cinema').className = mode==='cinema'? movieActive  : movieInactive;
  document.getElementById('mb-movie').className  = mode==='movie' ? mobActive    : mobInactive;
  document.getElementById('mb-cinema').className = mode==='cinema'? mobActive    : mobInactive;
  showPage(mode==='movie'?'page-movie':'page-cinema');
  if(mode==='movie') loadMovies(); else loadCinemas();
}
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
function goHome(){ showPage(S.mode==='movie'?'page-movie':'page-cinema'); }
function goBack(){
  showPage(S.mode==='movie'?'page-movie':'page-cinema');
  document.getElementById('detail-hero').style.height='';
}

// ════════════════════════════════════════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════════════════════════════════════════
function toggleSearch(){
  const bar = document.getElementById('search-bar');
  bar.classList.toggle('open');
  if(bar.classList.contains('open')) document.getElementById('search-input').focus();
}
function handleSearch(val){
  S.query=val.toLowerCase();
  if(S.mode==='movie') renderMovies(S.movies);
  else renderCinemas(S.cinemas);
}

// ════════════════════════════════════════════════════════════════════════════
// GPS
// ════════════════════════════════════════════════════════════════════════════
function requestGPS(){
  const lbl1=document.getElementById('gps-lbl');
  if(lbl1) lbl1.textContent='...';
  navigator.geolocation.getCurrentPosition(pos=>{
    S.lat=pos.coords.latitude; S.lng=pos.coords.longitude;
    if(lbl1){lbl1.textContent='On';document.getElementById('gps-btn').classList.add('text-primary','border-primary/50');}
    document.getElementById('gps-btn2')?.classList.add('bg-primary','text-white','glow-pink');
    if(S.mode==='cinema') loadCinemas();
  },()=>{ if(lbl1) lbl1.textContent='GPS'; });
}

// ════════════════════════════════════════════════════════════════════════════
// LOAD MOVIES
// ════════════════════════════════════════════════════════════════════════════
async function loadMovies(){
  renderMovieSkeleton();
  try{
    const res  = await fetch(`${API_BASE}/movies/now-playing`);
    const data = await res.json();
    S.movies   = (data.data||[]).map(m=>({ ...m, _tmdbKey:m.title_en||m.title_th }));
    renderMovies(S.movies);
    // Enrich with TMDB in background — re-render when done
    if(HAS_TMDB){
      enrichWithTMDB(S.movies).then(()=>renderMovies(S.movies));
    }
  }catch(e){ showErr('movie-grid','ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่'); }
}

function renderMovies(all){
  const movies = S.query ? all.filter(m=>(m.title_en||'').toLowerCase().includes(S.query)||(m.title_th||'').toLowerCase().includes(S.query)) : all;
  const grid   = document.getElementById('movie-grid');
  if(!movies.length){ grid.innerHTML=`<div class="col-span-full py-20 text-center text-on-surface-variant"><p class="text-5xl mb-4">🎬</p><p class="thai">ไม่พบหนัง</p></div>`; return; }

  grid.innerHTML = movies.map((m,i)=>{
    const poster = getPosterSrc(m);
    const genre  = (m.genre||'').split(',')[0].trim();
    return `
    <div class="mcard group" onclick="openDetail('${m.id}')" style="animation:fadeUp .35s ease ${i*.04}s both">
      <div class="relative aspect-[2/3] rounded-lg overflow-hidden mb-4 shadow-[0_12px_24px_rgba(0,0,0,0.85)] transition-transform duration-500 group-hover:scale-[1.02] border border-white/5">
        ${poster
          ? `<img src="${poster}" alt="${m.title_en||m.title_th}" class="w-full h-full object-cover" loading="lazy"
               onerror="this.parentElement.innerHTML='<div class=\'w-full h-full bg-surface-container-high flex items-center justify-center\'>🎬</div>'">`
          : `<div class="w-full h-full bg-surface-container-high flex items-center justify-center text-5xl">🎬</div>`}
        <div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent opacity-75"></div>
        ${m.rating?`<div class="absolute top-3 left-3"><span class="bg-black/70 backdrop-blur text-primary font-black px-2 py-1 rounded text-xs glow-pink border border-primary/30">${m.rating}</span></div>`:''}
        <div class="absolute bottom-3 left-3 right-3 flex flex-wrap gap-1">
          ${genre?`<span class="bg-primary/20 backdrop-blur text-primary text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-tight border border-primary/50">${genre}</span>`:''}
          ${m.runtime?`<span class="bg-white/10 backdrop-blur text-white text-[9px] font-bold px-2 py-0.5 rounded-full border border-white/20">${m.runtime}น.</span>`:''}
        </div>
      </div>
      <h3 class="card-title font-bold text-base leading-tight transition-colors thai">${m.title_th||m.title_en}</h3>
      ${m.title_th&&m.title_en?`<p class="text-on-surface-variant text-xs mt-1 truncate">${m.title_en}</p>`:''}
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// LOAD CINEMAS
// ════════════════════════════════════════════════════════════════════════════
async function loadCinemas(){
  renderCinemaSkeleton();
  try{
    let url = `${API_BASE}/cinemas`;
    if(S.lat&&S.lng) url+=`?lat=${S.lat}&lng=${S.lng}`;
    const res  = await fetch(url);
    const data = await res.json();
    S.cinemas  = data.data||[];
    renderCinemas(S.cinemas);
  }catch(e){ showErr('cinema-list','ไม่สามารถโหลดข้อมูลได้'); }
}

function renderCinemas(all){
  const cinemas = S.query ? all.filter(c=>(c.name_en||'').toLowerCase().includes(S.query)||(c.name_th||'').toLowerCase().includes(S.query)) : all;
  const list    = document.getElementById('cinema-list');
  const icons   = {major:'🎭',sf:'🎪',house:'🏠'};
  const srcName = {major:'Major Cineplex',sf:'SF Cinema',house:'House Samyan'};
  const srcCls  = {major:'text-yellow-400 border-yellow-400/30 bg-yellow-400/10',sf:'text-blue-400 border-blue-400/30 bg-blue-400/10',house:'text-primary border-primary/30 bg-primary/10'};

  list.innerHTML = cinemas.slice(0,50).map((c,i)=>`
    <article onclick="openCinemaDetail('${c.id}')" class="ccard group flex items-center bg-surface-container-low border border-outline-variant rounded-lg p-5 gap-5 overflow-hidden" style="animation:fadeUp .25s ease ${i*.025}s both">
      <div class="w-14 h-14 flex-shrink-0 bg-surface-container-high rounded-2xl flex items-center justify-center text-2xl">${icons[c.source]||'🎬'}</div>
      <div class="flex-grow min-w-0">
        <h2 class="font-bold text-base tracking-tight thai truncate">${c.name_th||c.name_en}</h2>
        <div class="flex items-center gap-2 mt-1 flex-wrap">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${srcCls[c.source]||'text-on-surface-variant border-outline-variant bg-surface-container'}">${srcName[c.source]||c.source}</span>
        </div>
      </div>
      <div class="flex items-center gap-3 flex-shrink-0">
        ${c.distance_km!==undefined?`<div class="text-right"><div class="text-primary font-black text-sm">${c.distance_km}km</div><div class="text-[9px] text-on-surface-variant uppercase">จากคุณ</div></div>`:''}
        <div class="bg-surface-container-high group-hover:bg-primary group-hover:glow-pink border border-outline-variant group-hover:border-transparent px-4 py-2 rounded-xl flex items-center gap-1 transition-all duration-300 text-xs font-bold whitespace-nowrap">
          ดูรอบ <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
        </div>
      </div>
    </article>`).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// MOVIE DETAIL
// ════════════════════════════════════════════════════════════════════════════
async function openDetail(movieId){
  const movie = S.movies.find(m=>m.id===movieId);
  if(!movie) return;
  showPage('page-detail');

  // Hero backdrop — prefer TMDB backdrop (wider/cinematic)
  const bd  = getBackdropSrc(movie);
  const bgEl= document.getElementById('detail-bg');
  if(bd){ bgEl.src=bd; bgEl.style.display='block'; } else bgEl.style.display='none';

  // Text
  document.getElementById('detail-title').textContent    = movie.title_en||movie.title_th;
  document.getElementById('detail-title-th').textContent = movie.title_th||'';
  // Use TMDB overview (in Thai) if available, else our synopsis
  const tmdbEntry = S.tmdbCache[movie._tmdbKey];
  document.getElementById('detail-synopsis').textContent = tmdbEntry?.overview || movie.synopsis || '';

  // Chips
  document.getElementById('detail-chips').innerHTML = [
    movie.rating ? `<span class="bg-primary text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider glow-pink">${movie.rating}</span>` : '',
    movie.runtime? `<span class="bg-surface-container-highest/80 backdrop-blur text-on-surface-variant px-3 py-1 rounded-full text-[10px] font-bold uppercase">${movie.runtime} MIN</span>` : '',
    movie.genre  ? `<span class="bg-surface-container-highest text-on-surface px-3 py-1 rounded-full text-[10px] font-bold uppercase">${movie.genre.split(',')[0].trim()}</span>` : '',
  ].filter(Boolean).join('');

  // Trailer
  S.trailerUrl = movie.trailer_url || null;
  const tb = document.getElementById('trailer-btn');
  tb.style.display = S.trailerUrl ? 'flex' : 'none';

  // Dates
  buildDates('detail-dates', ()=> loadShowtimesForMovie(movieId));
  document.getElementById('detail-date-label').textContent = fmtDateTH(S.date);

  // Showtimes
  document.getElementById('detail-showtimes').innerHTML = skelBlock(3,'h-24');
  await loadShowtimesForMovie(movieId);
}

async function loadShowtimesForMovie(movieId){
  document.getElementById('detail-showtimes').innerHTML = skelBlock(3,'h-24');
  try{
    const res  = await fetch(`${API_BASE}/showtimes?movie=${movieId}&date=${S.date}`);
    const data = await res.json();
    renderMovieShowtimes(data.data||[]);
  }catch{ document.getElementById('detail-showtimes').innerHTML=`<p class="text-on-surface-variant thai py-8 text-center">ไม่พบรอบฉาย</p>`; }
}

function renderMovieShowtimes(groups){
  if(!groups.length){
    document.getElementById('detail-showtimes').innerHTML=`<div class="text-center py-16 text-on-surface-variant"><p class="text-5xl mb-4">🎭</p><p class="thai">ไม่พบรอบฉายในวันที่เลือก</p><p class="text-sm mt-2">ลองเลือกวันอื่น</p></div>`;
    return;
  }
  document.getElementById('detail-showtimes').innerHTML = groups.map(cg=>`
    <div class="bg-surface-container-low rounded-lg p-5 border border-outline-variant">
      <h3 class="font-bold text-base mb-4 thai">${cg.name_th||cg.name_en}</h3>
      <div class="flex flex-wrap gap-2">${(cg.showtimes||[]).map(s=>`
        <a href="${s.booking_url}" target="_blank" rel="noopener"
          class="slot ${s.is_sold_out?'sold':''} flex flex-col items-center px-4 py-2.5 rounded-xl bg-surface-container-high border border-outline-variant min-w-[72px] text-center no-underline">
          <span class="font-black text-sm text-white">${fmtTime(s.show_time)}</span>
          ${s.screen_type!=='STANDARD'?`<span class="text-[9px] text-primary font-bold mt-0.5">${s.screen_type}</span>`:''}
          ${s.audio&&s.audio!=='TH'?`<span class="text-[9px] text-on-surface-variant">${s.audio}</span>`:''}
        </a>`).join('')}
      </div>
    </div>`).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// CINEMA DETAIL
// ════════════════════════════════════════════════════════════════════════════
async function openCinemaDetail(cinemaId){
  const cinema = S.cinemas.find(c=>c.id===cinemaId);
  if(!cinema) return;
  showPage('page-detail');

  // Compact hero (no backdrop for cinema)
  document.getElementById('detail-bg').style.display='none';
  document.getElementById('detail-hero').style.height='160px';
  document.getElementById('detail-title').textContent    = cinema.name_en||cinema.name_th;
  document.getElementById('detail-title-th').textContent = cinema.name_th||'';
  document.getElementById('detail-synopsis').textContent = '';
  document.getElementById('detail-chips').innerHTML      = '';
  document.getElementById('trailer-btn').style.display   = 'none';

  buildDates('detail-dates', ()=>loadShowtimesForCinema(cinemaId));
  document.getElementById('detail-date-label').textContent = fmtDateTH(S.date);
  document.getElementById('detail-showtimes').innerHTML   = skelBlock(3,'h-24');
  await loadShowtimesForCinema(cinemaId);
}

async function loadShowtimesForCinema(cinemaId){
  document.getElementById('detail-showtimes').innerHTML = skelBlock(3,'h-24');
  // reset hero height
  document.getElementById('detail-hero').style.height='';
  try{
    const res  = await fetch(`${API_BASE}/showtimes?cinema=${cinemaId}&date=${S.date}`);
    const data = await res.json();
    renderCinemaShowtimes(data.data||[]);
  }catch{ document.getElementById('detail-showtimes').innerHTML=`<p class="text-on-surface-variant thai py-8 text-center">ไม่พบรอบฉาย</p>`; }
}

function renderCinemaShowtimes(groups){
  if(!groups.length){
    document.getElementById('detail-showtimes').innerHTML=`<div class="text-center py-16 text-on-surface-variant"><p class="text-5xl mb-4">🎬</p><p class="thai">ไม่พบรอบฉายในวันที่เลือก</p></div>`;
    return;
  }
  document.getElementById('detail-showtimes').innerHTML = groups.map(mg=>{
    const poster = mg.poster_url;
    return `
    <div class="bg-surface-container-low rounded-lg p-5 border border-outline-variant">
      <div class="flex items-start gap-4 mb-4">
        ${poster?`<img src="${poster}" alt="" class="w-12 h-[72px] object-cover rounded-lg flex-shrink-0" onerror="this.style.display='none'">`:''}
        <div>
          <h3 class="font-bold text-base leading-tight thai">${mg.title_th||mg.title_en}</h3>
          <div class="flex gap-2 mt-1 flex-wrap">
            ${mg.rating?`<span class="text-[9px] px-2 py-0.5 bg-primary/10 text-primary rounded-full border border-primary/30 font-bold">${mg.rating}</span>`:''}
            ${mg.runtime?`<span class="text-[9px] px-2 py-0.5 bg-surface-container text-on-surface-variant rounded-full">${mg.runtime}น.</span>`:''}
          </div>
        </div>
      </div>
      <div class="flex flex-wrap gap-2">${(mg.showtimes||[]).map(s=>`
        <a href="${s.booking_url}" target="_blank" rel="noopener"
          class="slot ${s.is_sold_out?'sold':''} flex flex-col items-center px-4 py-2.5 rounded-xl bg-surface-container-high border border-outline-variant min-w-[72px] text-center no-underline">
          <span class="font-black text-sm text-white">${fmtTime(s.show_time)}</span>
          ${s.screen_type!=='STANDARD'?`<span class="text-[9px] text-primary font-bold mt-0.5">${s.screen_type}</span>`:''}
          ${s.audio&&s.audio!=='TH'?`<span class="text-[9px] text-on-surface-variant">${s.audio}</span>`:''}
        </a>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// MISC
// ════════════════════════════════════════════════════════════════════════════
function openTrailer(){ if(S.trailerUrl) window.open(S.trailerUrl,'_blank'); }

function renderMovieSkeleton(){
  document.getElementById('movie-grid').innerHTML = Array(10).fill(0).map(()=>`
    <div><div class="skel aspect-[2/3] mb-4"></div><div class="skel h-4 mb-2 w-3/4"></div><div class="skel h-3 w-1/2"></div></div>`).join('');
}
function renderCinemaSkeleton(){
  document.getElementById('cinema-list').innerHTML = Array(5).fill(0).map(()=>`<div class="skel h-24"></div>`).join('');
}
function skelBlock(n, cls){
  return `<div class="space-y-4">${Array(n).fill(0).map(()=>`<div class="skel ${cls}"></div>`).join('')}</div>`;
}
function showErr(id,msg){
  document.getElementById(id).innerHTML=`<div class="col-span-full text-center py-16 text-on-surface-variant"><p class="text-4xl mb-4">⚠️</p><p class="thai">${msg}</p></div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', ()=>{
  buildDates('movie-dates', ()=>loadMovies());
  loadMovies();
  loadCinemas();
});
</script>
